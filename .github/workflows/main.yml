名称: 更新订阅

开启:
  计划:
    # 每天在 UTC 时间 0:00、6:00、12:00、18:00 自动触发更新
    - cron: '0 */6 * * *'
 workflow_dispatch: # 支持手动点击运行

任务:
构建:
    运行平台: ubuntu-latest
    权限:
      内容: 写入

    步骤:
      - name: Checkout Code
使用: actions/checkout@v4

      - 名称: 设置 Python
使用: actions/setup-python@v5
        使用:
Python 版本: '3.10'
          缓存: 'pip'

      - 名称: 安装依赖
        运行: |
          pip install -r scripts/requirements.txt

      - 名称: 运行 Real-Prober 和 Classifier
        运行: |
          python scripts/main.py

      - 名称: 提交并推送结果
        运行: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/ README.md
          如果 git diff --staged --quiet; 则
            echo "没有节点变动与内容更新。"
          else
            git commit -m "自动更新：$(date -u '+%Y-%m-%d %H:%M:%S') UTC"
            git push
          fi
